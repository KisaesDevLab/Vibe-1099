# Dev override: expose postgres/redis to the host so api/worker can run via tsx.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis render
services:
  postgres:
    ports:
      - "55432:5432"
  redis:
    ports:
      - "56379:6379"
  # dev only: expose the render sidecar to the host so locally-run api/worker (tsx)
  # can reach it. In production it stays internal-only (see docker-compose.yml).
  render:
    ports:
      - "8212:8212"
