# Vibe Appliance manifest fragment — vibe-1099
id: vibe-1099
name: Vibe 1099
description: 1099 preparation, recipient delivery, and IRS IRIS A2A e-filing
version: 0.1.10
license: MIT
compose: ../docker-compose.yml
images:
  - vibe1099-app
  - vibe1099-web
  - vibe1099-render
ports:
  api: 8210
  web: 8211
  render: 8212
volumes:
  - vibe1099-pgdata
  - vibe1099-redisdata
  - vibe1099-backups
routes:
  private:
    host: "1099.{firm-domain}"
    upstream: vibe1099-web:8211
  tunnel:
    host: "1099-portal.{firm-domain}"
    upstream: vibe1099-web:8211
    paths:
      - /f/*
      - /w9/*
      - /client*
      - /api/portal/*
      - /api/w9-public/*
      - /api/client-portal/*
      - /assets/*
      - /api/health
secrets:
  - name: MASTER_KEY
    bytes: 32
    encoding: base64
    rotation: docs/key-rotation.md
env_inherit:
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_USER
  - SMTP_PASS
  - SMTP_FROM
  - SMS_PROVIDER
  - TEXTLINK_API_KEY
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_FROM_NUMBER
postgres_major: 16
redis_db_index: 3
health: /api/status
about: /api/about
backup:
  kind: pg_dump
  volume: vibe1099-backups
  doc: docs/backup-restore.md
