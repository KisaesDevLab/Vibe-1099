server {
    listen 8211;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the HTML documents nginx serves — the API's helmet
    # headers only ever reach JSON responses, so without these the staff SPA and
    # the recipient / W-9 / client portal pages had no CSP, no frame-ancestors
    # and no Referrer-Policy (a token-bearing portal URL could leak via Referer).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # API proxy to the api container
    location /api/ {
        proxy_pass http://api:8210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    # Vibe Auth (SSO) engine routes live on the api too (/auth/status, /auth/oidc/*,
    # /auth/settings). X-Forwarded-Proto is what the engine uses for its own origin.
    location /auth/ {
        proxy_pass http://api:8210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
